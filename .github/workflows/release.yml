name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/SimpleLauncher/SimpleLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/SimpleLauncher
      - run: Compress-Archive -Path artifacts/SimpleLauncher/* -DestinationPath artifacts/SimpleLauncher-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SimpleLauncher-win-x64.zip
