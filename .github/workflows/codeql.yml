name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "24 3 * * 1"

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - run: dotnet build SimpleLauncher.sln --configuration Release
      - uses: github/codeql-action/analyze@v3
